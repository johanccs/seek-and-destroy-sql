name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore api/SqlPerf.Api/SqlPerf.Api.csproj

      - name: Build
        run: dotnet build api/SqlPerf.Api/SqlPerf.Api.csproj --no-restore --configuration Release

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches web/Dockerfile. Vite 8 requires ^20.19 || >=22.12, and
          # pinning "20" would have relied on it resolving past 20.19 by luck.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          # Vite bakes this into the bundle at build time. Without it, the
          # app falls back to its http://localhost:5080 dev default, which
          # is unreachable from a real visitor's browser (this broke the
          # site once already — see commit history).
          VITE_API_BASE: https://seek-and-destroy-api.azurewebsites.net

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  deploy-api:
    needs: build-api
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish api/SqlPerf.Api/SqlPerf.Api.csproj --configuration Release --output ${{ github.workspace }}/publish

      # SCM basic-auth publishing is disabled on this App Service, so a
      # publish-profile deploy is rejected outright — use OIDC federated
      # login instead (app registration gh-actions-seek-and-destroy,
      # Website Contributor on rg-seek-and-destroy).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: seek-and-destroy-api
          package: ${{ github.workspace }}/publish

  deploy-web:
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "web/dist"
          skip_app_build: true
          skip_deploy_on_missing_secrets: false
